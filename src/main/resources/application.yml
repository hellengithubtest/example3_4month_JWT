server.port: 8090

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
  jpa:
    defer-datasource-initialization: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15m
  refresh-token-expiration: 7d
app:
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
      max-age: 1h
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # Убирает лишние эндпоинты Spring Boot Actuator и Basic Error Controller
    filter: true
    operationsSorter: method
    tagsSorter: alpha
