server.port: 8090

spring:
  datasource:
    url: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
  jpa:
    defer-datasource-initialization: true
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000   # 15 мин (мс)
  refresh-token-expiration: 604800000 # 7 дней (мс)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    # Убирает лишние эндпоинты Spring Boot Actuator и Basic Error Controller
    filter: true
    operationsSorter: method
    tagsSorter: alpha
